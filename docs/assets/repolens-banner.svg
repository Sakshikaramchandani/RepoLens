<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="RepoLens — ask your codebase, in any language. Answers with line numbers.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.75" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0b0c" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19191c"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="#0b0b0c"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="20" fill="url(#fade)"/>
  <rect width="1280" height="400" rx="20" fill="url(#glow)"/>

  <!-- mark -->
  <g transform="translate(88 118)">
    <rect width="64" height="64" rx="16" fill="#f4f4f5"/>
    <circle cx="32" cy="32" r="17" fill="none" stroke="#0b0b0c" stroke-width="5"/>
    <circle cx="38" cy="26" r="5.2" fill="#f97316"/>
  </g>

  <g font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="172" y="166" fill="#f4f4f5" font-size="56" font-weight="700" letter-spacing="-1.6">RepoLens</text>
    <text x="90" y="240" fill="#f4f4f5" font-size="30" font-weight="600" letter-spacing="-0.6">Ask your codebase.</text>
    <text x="90" y="280" fill="#a1a1aa" font-size="30" font-weight="600" letter-spacing="-0.6">Get answers with line numbers.</text>
    <text x="90" y="330" fill="#71717a" font-size="16">AI chat · code review · risk map — for any codebase, in 30+ languages</text>
  </g>

  <!-- product fragment: a cited answer -->
  <g transform="translate(760 96)" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="440" height="214" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="22" cy="22" r="4.5" fill="#34343a"/>
    <circle cx="38" cy="22" r="4.5" fill="#34343a"/>
    <circle cx="54" cy="22" r="4.5" fill="#34343a"/>
    <text x="418" y="26" fill="#71717a" font-size="11" text-anchor="end" font-family="'Geist Mono', ui-monospace, Menlo, monospace">deepseek-v4-1-flash</text>
    <line x1="16" y1="42" x2="424" y2="42" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="214" y="58" width="210" height="32" rx="9" fill="#f4f4f5"/>
    <text x="319" y="79" fill="#0b0b0c" font-size="13" text-anchor="middle">Where is the JWT validated?</text>
    <rect x="16" y="106" width="22" height="22" rx="6" fill="#f97316" fill-opacity="0.15"/>
    <path d="M27 111l1.6 4.4 4.4 1.6-4.4 1.6L27 123l-1.6-4.4-4.4-1.6 4.4-1.6z" fill="#fb923c"/>
    <text x="50" y="121" fill="#d4d4d8" font-size="13">JwtAuthFilter reads the Bearer header, then</text>
    <text x="50" y="141" fill="#d4d4d8" font-size="13">JwtService.isValid() checks signature and expiry.</text>
    <g font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="11">
      <rect x="50" y="160" width="186" height="24" rx="5" fill="#232327" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="62" y="176" fill="#d4d4d8"><tspan fill="#fb923c">◆</tspan> JwtAuthFilter.java:31-58</text>
      <rect x="244" y="160" width="172" height="24" rx="5" fill="#232327" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="256" y="176" fill="#d4d4d8"><tspan fill="#fb923c">◆</tspan> JwtService.java:40-62</text>
    </g>
  </g>
</svg>
