<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="RepoLens — ask your codebase questions and get answers with file and line citations, AI code review and risk analysis."
    />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <title>RepoLens — code intelligence for any codebase</title>

    <!--
      Runs BEFORE React loads so the page never flashes the wrong theme.
      The key must stay in sync with src/theme/ThemeProvider.tsx.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem("repolens.theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
        } catch (e) {
          root.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
